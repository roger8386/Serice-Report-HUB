<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQMS & CEMS Cloud Diagnostic Hub</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #162032;
      --panel-bg: #0d1524;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #26354a;
      --border-focus: #38bdf8;
      --alarm-red: #ef4444;
      --alarm-title: #fca5a5;
      --btn-bg: #0284c7;
      --btn-hover: #0369a1;
      --step-badge: #0284c7;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 24px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    /* Header layout */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
      gap: 16px; 
    }
    .header-text { flex: 1; min-width: 260px; }
    h1 { font-size: 1.85rem; color: var(--accent); margin-bottom: 4px; }
    
    .header-controls { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: nowrap; 
      justify-content: flex-end; 
    }
    .sync-status { 
      font-size: 0.82rem; 
      color: var(--success-green); 
      font-weight: 600; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      white-space: nowrap; 
      margin-right: 4px;
    }
    .admin-indicator {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success-green);
      color: var(--success-green);
      white-space: nowrap;
    }

    .btn { padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary { background-color: var(--btn-bg); color: #fff; }
    .btn-primary:hover { background-color: var(--btn-hover); }
    .btn-danger { background-color: var(--alarm-red); color: #fff; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-secondary { background-color: var(--border); color: var(--text-main); }
    .btn-secondary:hover { background-color: #334661; }

    .step-box { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .step-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 700; margin-bottom: 10px; display: block; }
    select, input, textarea { width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--panel-bg); color: var(--text-main); font-size: 0.95rem; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: var(--border-focus); }

    /* Accordion Problem Card */
    .problem-list { display: flex; flex-direction: column; gap: 12px; }
    .problem-item { border: 1px solid var(--border); background-color: var(--panel-bg); border-radius: 6px; overflow: hidden; transition: border-color 0.2s ease; }
    .problem-item:hover { border-color: #3b506f; }
    .problem-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: none; width: 100%; border: none; color: inherit; text-align: left; }
    .problem-title { font-size: 1rem; font-weight: 600; color: var(--alarm-title); display: flex; align-items: center; gap: 10px; }
    .icon-toggle { color: var(--text-sub); font-size: 0.85rem; transition: transform 0.2s ease; }
    .problem-item.active .icon-toggle { transform: rotate(180deg); }
    .solution-body { display: none; padding: 18px 20px; background-color: rgba(0, 0, 0, 0.45); border-top: 1px solid var(--border); }
    .problem-item.active .solution-body { display: block; }

    /* Paired Cause & Action Box */
    .diagnostic-pair-card {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .diagnostic-pair-card:last-of-type { margin-bottom: 0; }
    
    .cause-row {
      margin-bottom: 12px;
      padding: 10px 14px;
      background-color: rgba(239, 68, 68, 0.08);
      border-left: 4px solid var(--alarm-red);
      border-radius: 4px;
    }
    .cause-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #f87171; margin-bottom: 4px; display: block; }
    .cause-text { font-size: 0.95rem; color: #f1f5f9; font-weight: 500; }

    .action-row {
      padding-left: 4px;
    }
    .action-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 8px; display: block; }
    
    .steps-container { display: flex; flex-direction: column; gap: 8px; }
    .step-card { background-color: rgba(0, 0, 0, 0.3); border: 1px solid #1f2d42; border-radius: 6px; padding: 10px 14px; }
    .step-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; color: #e2e8f0; margin-bottom: 4px; }
    .step-badge { background-color: var(--step-badge); color: #fff; font-size: 0.7rem; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .step-detail { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; }
    .step-verify { font-size: 0.83rem; color: #34d399; background-color: rgba(52, 211, 153, 0.08); padding: 4px 8px; border-radius: 4px; display: inline-block; width: 100%; }
    
    .admin-item-actions { margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; gap: 8px; }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 16px; }
    .modal-content { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-width: 760px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { font-size: 1.3rem; margin-bottom: 16px; color: var(--accent); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
    
    /* Dynamic Modal Builder Blocks */
    .modal-pair-block {
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
    }
    .modal-pair-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal-pair-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }
    
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
    .placeholder-msg { color: var(--text-sub); font-style: italic; text-align: center; padding: 24px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-text">
      <h1>AQMS & CEMS Cloud Diagnostic Hub</h1>
      <p style="color: var(--text-sub);">Real-time synchronized field diagnostic procedures.</p>
    </div>
    <div class="header-controls">
      <span id="syncIndicator" class="sync-status">🟢 Connecting...</span>
      <span id="adminBadge" class="admin-indicator hidden">Admin Active</span>
      <button id="addModelBtn" class="btn btn-secondary hidden" onclick="promptAddNewModel()">+ Add Model</button>
      <button id="addIssueBtn" class="btn btn-secondary hidden" onclick="openAddIssueModal()">+ Add New Entry</button>
      <button id="adminLoginBtn" class="btn btn-primary" onclick="handleAdminToggle()">Admin Login</button>
    </div>
  </header>

  <div class="step-box">
    <label class="step-label" for="modelSelector">STEP 1: SELECT ANALYZER MODEL</label>
    <select id="modelSelector">
      <option value="">-- Select Model --</option>
    </select>
  </div>

  <div class="step-box">
    <span class="step-label">Steps 2 & 3: Alarms & Paired Corrective Solutions</span>
    <div id="problemsContainer" class="problem-list">
      <div class="placeholder-msg">Select an analyzer model above to begin.</div>
    </div>
  </div>
</div>

<!-- Modal Entry Form with Dynamic Paired Inputs -->
<div id="adminModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Troubleshooting Entry</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="form-group">
      <label for="editModelInput">Target Model:</label>
      <input 
        type="text" 
        id="editModelInput" 
        list="modelDatalist" 
        placeholder="Select from list or type a new model..." 
        required 
      />
      <datalist id="modelDatalist"></datalist>
    </div>

    <div class="form-group">
      <label for="editProblem">Alarm / Issue Title:</label>
      <input type="text" id="editProblem" placeholder="e.g. Alarm - Internal Temp">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px;">
      <span style="font-size: 0.85rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">Causes & Corresponding Actions:</span>
      <button type="button" class="btn btn-secondary" style="font-size: 0.8rem; padding: 4px 10px;" onclick="addCauseActionBlock()">+ Add Cause & Action Pair</button>
    </div>

    <div id="pairsContainer"></div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeAdminModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIssue()">Save to Cloud</button>
    </div>
  </div>
</div>

<!-- Hidden Password Admin Login Modal -->
<div id="loginModal" class="modal-overlay hidden">
  <div class="modal-content" style="max-width: 380px;">
    <h2>Admin Login</h2>
    <div class="form-group">
      <label for="adminPinInput">Enter Admin PIN:</label>
      <input 
        type="password" 
        id="adminPinInput" 
        placeholder="••••" 
        autocomplete="off" 
        style="font-size: 1.2rem; letter-spacing: 0.2em; text-align: center;"
      />
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeLoginModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAdminLogin()">Login</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC61LascxfSDWGq-Bx5Xj_Am_9bVrt48y8",
    authDomain: "aqms-troubleshootin.firebaseapp.com",
    databaseURL: "https://aqms-troubleshootin-default-rtdb.firebaseio.com",
    projectId: "aqms-troubleshootin",
    storageBucket: "aqms-troubleshootin.firebasestorage.app",
    messagingSenderId: "482318487046",
    appId: "1:482318487046:web:8896d267e19f9ac656bd87",
    measurementId: "G-73LMX8VFBS"
  };

  let dbRef = null;
  let isFirebaseAvailable = false;
  try {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('cems_knowledge_base');
    isFirebaseAvailable = true;
  } catch (e) {
    document.getElementById('syncIndicator').innerHTML = '⚠️ Offline Mode (Local Storage Only)';
    document.getElementById('syncIndicator').style.color = '#f59e0b';
  }

  const modelDisplayNames = {
    "48i": "Model 48i (CO Infrared Gas Filter Correlation Analyzer)",
    "49i": "Model 49i (UV Photometric O₃ Analyzer)",
    "55i": "Model 55i (NMHC / CH₄ FID Analyzer)",
    "42i": "Model 42i (NO-NO₂-NOₓ Chemiluminescence)",
    "43i": "Model 43i (Pulsed Fluorescence SO₂)",
    "450i": "Model 450i (Pulsed Fluorescence H₂S - SO₂)",
    "17i": "Model 17i (Ammonia NH₃ Chemiluminescence)",
    "5014i": "Model 5014i (Beta Particulate Monitor)",
    "5028i": "Model 5028i (Dual Channel Beta Monitor PM10/PM2.5)",
    "111": "Model 111 (Zero Air Supply with External Compressor)",
    "1150": "Model 1150 (CO Catalyst Reactor Module)"
  };

  const defaultDatabase = {
    "48i": [], "49i": [], "55i": [], "42i": [], "43i": [],
    "450i": [], "17i": [], "5014i": [], "5028i": [], "111": [], "1150": []
  };

  const ADMIN_PIN = "1986";
  let isAdmin = false;
  let activeDb = defaultDatabase;

  const modelSelector = document.getElementById('modelSelector');
  const editModelInput = document.getElementById('editModelInput');
  const modelDatalist = document.getElementById('modelDatalist');
  const problemsContainer = document.getElementById('problemsContainer');
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminBadge = document.getElementById('adminBadge');
  const addModelBtn = document.getElementById('addModelBtn');
  const addIssueBtn = document.getElementById('addIssueBtn');
  const syncIndicator = document.getElementById('syncIndicator');

  const loginModal = document.getElementById('loginModal');
  const adminPinInput = document.getElementById('adminPinInput');

  function renderModelDropdown(selectedKey) {
    const prevSelected = selectedKey || modelSelector.value;
    modelSelector.innerHTML = '<option value="">-- Select Model --</option>';
    modelDatalist.innerHTML = '';

    const keys = Object.keys(activeDb);

    keys.forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = modelDisplayNames[key] || key;
      modelSelector.appendChild(opt);

      const dOpt = document.createElement('option');
      dOpt.value = key;
      modelDatalist.appendChild(dOpt);
    });

    if (prevSelected && keys.includes(prevSelected)) {
      modelSelector.value = prevSelected;
    }
  }

  if (isFirebaseAvailable) {
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        activeDb = data;
        syncIndicator.innerHTML = '🟢 Cloud Connected';
      } else {
        dbRef.set(defaultDatabase);
        syncIndicator.innerHTML = '🟢 Database Initialized';
      }
      renderModelDropdown();
      renderProblems();
    }, (error) => {
      syncIndicator.innerHTML = '⚠️ Firebase Error: ' + error.message;
      syncIndicator.style.color = '#ef4444';
      renderModelDropdown();
      renderProblems();
    });
  } else {
    renderModelDropdown();
    renderProblems();
  }

  function renderProblems() {
    const selectedModel = modelSelector.value;
    problemsContainer.innerHTML = '';

    if (!selectedModel || !activeDb[selectedModel]) {
      problemsContainer.innerHTML = `<div class="placeholder-msg">Select an analyzer model above to begin.</div>`;
      return;
    }

    const items = activeDb[selectedModel];
    if (!items || items.length === 0) {
      problemsContainer.innerHTML = `<div class="placeholder-msg">No entries recorded for this model yet. Use Admin Mode to create entries.</div>`;
      return;
    }

    items.forEach((item, index) => {
      const problemDiv = document.createElement('div');
      problemDiv.className = 'problem-item';

      let pairsHtml = '';

      if (item.pairs && Array.isArray(item.pairs)) {
        pairsHtml = item.pairs.map((pair, pIdx) => {
          const stepsHtml = (pair.steps || []).map((st, sIdx) => `
            <div class="step-card">
              <div class="step-head">
                <span class="step-badge">${sIdx + 1}</span>
                <span>${st.title}</span>
              </div>
              <div class="step-detail">${st.detail}</div>
              <div class="step-verify"><strong>Verification: </strong>${st.verify}</div>
            </div>
          `).join('');

          return `
            <div class="diagnostic-pair-card">
              <div class="cause-row">
                <span class="cause-label">Probable Cause #${pIdx + 1}:</span>
                <div class="cause-text">${pair.cause}</div>
              </div>
              <div class="action-row">
                <span class="action-label">Corrective Action / Solution:</span>
                <div class="steps-container">
                  ${stepsHtml || '<div class="step-detail">No action specified.</div>'}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        const legacySteps = (item.steps || []).map((st, sIdx) => `
          <div class="step-card">
            <div class="step-head">
              <span class="step-badge">${sIdx + 1}</span>
              <span>${st.title}</span>
            </div>
            <div class="step-detail">${st.detail}</div>
            <div class="step-verify"><strong>Verification: </strong>${st.verify}</div>
          </div>
        `).join('');

        pairsHtml = `
          <div class="diagnostic-pair-card">
            <div class="cause-row">
              <span class="cause-label">Probable Causes:</span>
              <div class="cause-text">${item.causes || 'None specified'}</div>
            </div>
            <div class="action-row">
              <span class="action-label">Corrective Actions:</span>
              <div class="steps-container">
                ${legacySteps}
              </div>
            </div>
          </div>
        `;
      }

      let adminActionsHtml = '';
      if (isAdmin) {
        adminActionsHtml = `
          <div class="admin-item-actions">
            <button class="btn btn-secondary" onclick="editIssue('${selectedModel}', ${index})">✏️ Edit</button>
            <button class="btn btn-danger" onclick="deleteIssue('${selectedModel}', ${index})">🗑️ Delete</button>
          </div>
        `;
      }

      problemDiv.innerHTML = `
        <button class="problem-header" onclick="toggleProblem(this)">
          <span class="problem-title">⚠️ ${item.problem}</span>
          <span class="icon-toggle">▼</span>
        </button>
        <div class="solution-body">
          ${pairsHtml}
          ${adminActionsHtml}
        </div>
      `;

      problemsContainer.appendChild(problemDiv);
    });
  }

  modelSelector.addEventListener('change', renderProblems);

  function toggleProblem(buttonElement) {
    const parentItem = buttonElement.closest('.problem-item');
    parentItem.classList.toggle('active');
  }

  /* Admin Authentication Logic na Naka-mask ang Password */
  function handleAdminToggle() {
    if (!isAdmin) {
      adminPinInput.value = "";
      loginModal.classList.remove('hidden');
      setTimeout(() => adminPinInput.focus(), 50);
    } else {
      isAdmin = false;
      adminBadge.classList.add('hidden');
      addModelBtn.classList.add('hidden');
      addIssueBtn.classList.add('hidden');
      adminLoginBtn.textContent = "Admin Login";
      adminLoginBtn.className = "btn btn-primary";
      renderProblems();
    }
  }

  function closeLoginModal() {
    loginModal.classList.add('hidden');
    adminPinInput.value = "";
  }

  function submitAdminLogin() {
    const pin = adminPinInput.value.trim();
    if (pin === ADMIN_PIN) {
      isAdmin = true;
      adminBadge.classList.remove('hidden');
      addModelBtn.classList.remove('hidden');
      addIssueBtn.classList.remove('hidden');
      adminLoginBtn.textContent = "Logout";
      adminLoginBtn.className = "btn btn-danger";
      closeLoginModal();
      renderProblems();
    } else {
      alert("Invalid PIN. Access denied.");
      adminPinInput.value = "";
      adminPinInput.focus();
    }
  }

  adminPinInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      submitAdminLogin();
    }
  });

  function promptAddNewModel() {
    const newName = prompt("Enter the name of the new analyzer model (e.g. Model 146i or EnviDAS / EnviDAS Ultimate):");
    if (!newName || !newName.trim()) return;

    const fullTitle = newName.trim();
    // Papalitan ang bawal na characters ng dash (-) para ligtas sa Firebase Key
    const safeKey = fullTitle.replace(/[\/\.#$\[\]]/g, '-');
    modelDisplayNames[safeKey] = fullTitle;

    if (!activeDb[safeKey]) {
      activeDb[safeKey] = [
        {
          problem: "Initial Baseline Check",
          pairs: [
            {
              cause: "Initial configuration check for new model",
              steps: [
                { title: "Power and Diagnostic Verification", detail: "Verify supply voltages, communication links, and baseline sensor outputs.", verify: "Diagnostics report normal status." }
              ]
            }
          ]
        }
      ];

      if (isFirebaseAvailable) {
        dbRef.set(activeDb).then(() => {
          renderModelDropdown(safeKey);
          modelSelector.value = safeKey;
          renderProblems();
        }).catch(err => alert("Error saving to cloud: " + err.message));
      } else {
        renderModelDropdown(safeKey);
        modelSelector.value = safeKey;
        renderProblems();
      }
    } else {
      modelSelector.value = safeKey;
      renderProblems();
    }
  }

  const adminModal = document.getElementById('adminModal');
  const editIndexInput = document.getElementById('editIndex');
  const editProblemInput = document.getElementById('editProblem');
  const pairsContainer = document.getElementById('pairsContainer');
  const modalTitle = document.getElementById('modalTitle');

  function addCauseActionBlock(causeValue = "", stepsValue = "") {
    const blockIndex = pairsContainer.children.length + 1;
    const blockDiv = document.createElement('div');
    blockDiv.className = 'modal-pair-block';

    blockDiv.innerHTML = `
      <div class="modal-pair-header">
        <span class="modal-pair-badge">Cause & Action Set #${blockIndex}</span>
        <button type="button" class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="removeCauseActionBlock(this)">Remove</button>
      </div>
      <div class="form-group" style="margin-bottom: 10px;">
        <label>Probable Cause:</label>
        <input type="text" class="pair-cause-input" placeholder="e.g. Instrument overheating or fan failure" value="${causeValue.replace(/"/g, '&quot;')}" />
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label>Action / Solution Steps (Format: Title | Detail | Verification):</label>
        <textarea rows="4" class="pair-steps-input" placeholder="Inspect Exhaust Fan | Check rear fan operation | Fan spins quietly without stalling">${stepsValue}</textarea>
      </div>
    `;

    pairsContainer.appendChild(blockDiv);
  }

  function removeCauseActionBlock(btn) {
    const block = btn.closest('.modal-pair-block');
    block.remove();
    const badges = pairsContainer.querySelectorAll('.modal-pair-badge');
    badges.forEach((b, i) => b.textContent = `Cause & Action Set #${i + 1}`);
  }

  function openAddIssueModal() {
    modalTitle.textContent = "Add Troubleshooting Entry";
    editIndexInput.value = "-1";
    editModelInput.value = modelSelector.value || "";
    editProblemInput.value = "";
    pairsContainer.innerHTML = "";
    addCauseActionBlock();
    adminModal.classList.remove('hidden');
  }

  function editIssue(model, index) {
    const item = activeDb[model][index];
    modalTitle.textContent = "Edit Troubleshooting Entry";
    editIndexInput.value = index;
    editModelInput.value = model;
    editProblemInput.value = item.problem;
    pairsContainer.innerHTML = "";

    if (item.pairs && Array.isArray(item.pairs)) {
      item.pairs.forEach(p => {
        const stepsText = (p.steps || []).map(s => `${s.title} | ${s.detail} | ${s.verify}`).join('\n');
        addCauseActionBlock(p.cause, stepsText);
      });
    } else {
      const legacyStepsText = (item.steps || []).map(s => `${s.title} | ${s.detail} | ${s.verify}`).join('\n');
      addCauseActionBlock(item.causes || "", legacyStepsText);
    }

    if (pairsContainer.children.length === 0) {
      addCauseActionBlock();
    }

    adminModal.classList.remove('hidden');
  }

  function closeAdminModal() {
    adminModal.classList.add('hidden');
  }

  function saveIssue() {
    const rawModel = editModelInput.value.trim();
    const index = parseInt(editIndexInput.value, 10);
    const problem = editProblemInput.value.trim();

    if (!rawModel || !problem) {
      alert("Please specify both a Model and an Alarm/Problem Title.");
      return;
    }

    const model = rawModel.replace(/[\/\.#$\[\]]/g, '-');
    modelDisplayNames[model] = rawModel;

    const pairBlocks = pairsContainer.querySelectorAll('.modal-pair-block');
    if (pairBlocks.length === 0) {
      alert("Please add at least one Cause & Action pair.");
      return;
    }

    const pairs = [];
    for (let i = 0; i < pairBlocks.length; i++) {
      const cause = pairBlocks[i].querySelector('.pair-cause-input').value.trim();
      const rawSteps = pairBlocks[i].querySelector('.pair-steps-input').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

      if (!cause || rawSteps.length === 0) {
        alert(`Cause and Solution steps in Set #${i + 1} cannot be empty. Follow the format: Title | Detail | Verification.`);
        return;
      }

      const steps = rawSteps.map(line => {
        const parts = line.split('|').map(p => p.trim());
        return {
          title: parts[0] || "Corrective Step",
          detail: parts[1] || parts[0] || "Execute procedure.",
          verify: parts[2] || "Confirm normal status in diagnostics."
        };
      });

      pairs.push({ cause, steps });
    }

    const newEntry = { problem, pairs };

    if (!activeDb[model]) {
      activeDb[model] = [];
    }

    if (index === -1) {
      activeDb[model].push(newEntry);
    } else {
      activeDb[model][index] = newEntry;
    }

    if (isFirebaseAvailable) {
      dbRef.set(activeDb).then(() => {
        closeAdminModal();
        renderModelDropdown(model);
        modelSelector.value = model;
        renderProblems();
      }).catch(err => alert("Error saving to cloud: " + err.message));
    } else {
      closeAdminModal();
      renderModelDropdown(model);
      modelSelector.value = model;
      renderProblems();
    }
  }

  function deleteIssue(model, index) {
    if (confirm("Are you sure you want to permanently delete this troubleshooting entry from the cloud database?")) {
      activeDb[model].splice(index, 1);
      
      if (activeDb[model].length === 0) {
        delete activeDb[model];
      }

      if (isFirebaseAvailable) {
        dbRef.set(activeDb).then(() => {
          renderModelDropdown();
          renderProblems();
        });
      } else {
        renderModelDropdown();
        renderProblems();
      }
    }
  }
</script>

</body>
</html>
