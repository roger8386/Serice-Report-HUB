<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQMS & CEMS Cloud Diagnostic Hub</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #162032;
      --panel-bg: #0d1524;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #26354a;
      --alarm-red: #ef4444;
      --alarm-title: #fca5a5;
      --btn-bg: #0284c7;
      --btn-hover: #0369a1;
      --step-badge: #0369a1;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 24px; line-height: 1.5; }
    .container { max-width: 1050px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 1.85rem; color: var(--accent); margin-bottom: 4px; }
    .sync-status { font-size: 0.85rem; color: var(--success-green); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .btn { padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: background 0.2s ease; }
    .btn-primary { background-color: var(--btn-bg); color: #fff; }
    .btn-primary:hover { background-color: var(--btn-hover); }
    .btn-danger { background-color: var(--alarm-red); color: #fff; }
    .btn-secondary { background-color: var(--border); color: var(--text-main); }
    .btn-secondary:hover { background-color: #334661; }

    .step-box { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .step-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 700; margin-bottom: 10px; display: block; }
    select, input, textarea { width: 100%; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--panel-bg); color: var(--text-main); font-size: 1rem; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }

    .problem-list { display: flex; flex-direction: column; gap: 12px; }
    .problem-item { border: 1px solid var(--border); background-color: var(--panel-bg); border-radius: 6px; overflow: hidden; transition: border-color 0.2s ease; }
    .problem-item:hover { border-color: #3b506f; }
    .problem-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: none; width: 100%; border: none; color: inherit; text-align: left; }
    .problem-title { font-size: 1rem; font-weight: 600; color: var(--alarm-title); display: flex; align-items: center; gap: 10px; }
    .icon-toggle { color: var(--text-sub); font-size: 0.85rem; transition: transform 0.2s ease; }
    .problem-item.active .icon-toggle { transform: rotate(180deg); }
    .solution-body { display: none; padding: 18px 20px; background-color: rgba(0, 0, 0, 0.4); border-top: 1px solid var(--border); }
    .problem-item.active .solution-body { display: block; }

    .section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 6px; }
    .causes-box { margin-bottom: 16px; padding: 12px 14px; background-color: rgba(239, 68, 68, 0.08); border-left: 4px solid var(--alarm-red); border-radius: 4px; color: #f1f5f9; font-size: 0.93rem; }
    .steps-container { display: flex; flex-direction: column; gap: 10px; }
    .step-card { background-color: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
    .step-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.94rem; color: #e2e8f0; margin-bottom: 4px; }
    .step-badge { background-color: var(--step-badge); color: #fff; font-size: 0.75rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
    .step-detail { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 6px; }
    .step-verify { font-size: 0.85rem; color: #34d399; background-color: rgba(52, 211, 153, 0.08); padding: 6px 10px; border-radius: 4px; display: inline-block; width: 100%; }
    .admin-item-actions { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; gap: 8px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 16px; }
    .modal-content { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-width: 650px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { font-size: 1.3rem; margin-bottom: 16px; color: var(--accent); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .placeholder-msg { color: var(--text-sub); font-style: italic; text-align: center; padding: 24px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">

      <button id="addIssueBtn" class="btn btn-secondary hidden" onclick="openAddIssueModal()">+ Add New Entry</button>

  </header>

  <div class="step-box">
    <label class="step-label" for="modelSelector">Step 1: Select Analyzer Model</label>

      <option value="49i">Model 49i (UV Photometric O₃ Analyzer)</option>
      <option value="55i">Model 55i (NMHC / CH₄ FID Analyzer)</option>
      <option value="42i">Model 42i (NO-NO₂-NOₓ Chemiluminescence)</option>
      <option value="43i">Model 43i (Pulsed Fluorescence SO₂)</option>
      <option value="450i">Model 450i (Pulsed Fluorescence H₂S - SO₂)</option>
      <option value="17i">Model 17i (Ammonia NH₃ Chemiluminescence)</option>
      <option value="5014i">Model 5014i (Beta Particulate Monitor)</option>
      <option value="5028i">Model 5028i (Dual Channel Beta Monitor PM10/PM2.5)</option>
      <option value="111">Model 111 (Zero Air Supply with External Compressor)</option>
      <option value="1150">Model 1150 (CO Catalyst Reactor Module)</option>
    </select>
  </div>

  <div class="step-box">
    <span class="step-label">Steps 2 & 3: Alarms / Symptoms (Click to reveal Step-by-Step Procedure)</span>
    <div id="problemsContainer" class="problem-list">
      <div class="placeholder-msg">Select an analyzer model above to begin.</div>
    </div>
  </div>
</div>

<!-- Modal Entry Form -->
<div id="adminModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Troubleshooting Entry</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="form-group">
      <label for="editModel">Target Model</label>
      <select id="editModel">
        <option value="48i">Model 48i (CO)</option>
        <option value="49i">Model 49i (O₃)</option>
        <option value="55i">Model 55i (NMHC)</option>
        <option value="42i">Model 42i (NOx)</option>
        <option value="43i">Model 43i (SO₂)</option>
        <option value="450i">Model 450i (H₂S-SO₂)</option>
        <option value="17i">Model 17i (NH₃)</option>
        <option value="5014i">Model 5014i (Beta)</option>
        <option value="5028i">Model 5028i (Dual Beta)</option>
        <option value="111">Model 111 (Zero Air)</option>
        <option value="1150">Model 1150 (CO Reactor)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="editProblem">Alarm / Issue Title</label>
      <input type="text" id="editProblem" placeholder="...">
    </div>

    <div class="form-group">
      <label for="editCauses">Probable Causes</label>
      <textarea id="editCauses" rows="3" placeholder="..."></textarea>
    </div>

    <div class="form-group">
      <label for="editStepsText">Steps (Format: Title | Detail | Verification)</label>
      <textarea id="editStepsText" rows="6" placeholder="Check Filter | Inspect 47mm filter | Flow recovers"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeAdminModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIssue()">Save to Cloud</button>
    </div>
  </div>
</div>

          { title: "Multi-Point Flow Calibration", detail: "Connect certified transfer standard (e.g., DeltaCal) to inlet and enter Calibration > Flow menu.", verify: "Adjust calibration factors until flow matches 16.67 LPM ± 1%." }
        ]
      }
    ],
    "5028i": [
      {
        problem: "Channel A or B Filter Tape Failure",
        causes: "Tape runout on respective spool, clamp alignment failure, or sticky dual-head motor.",
        steps: [
          { title: "Identify Faulting Channel", detail: "Check alarm screen to identify if Channel A (PM10) or Channel B (PM2.5) triggered error.", verify: "Inspect specific tape spool and tension rollers for slack." },
          { title: "Exercise Head Clamping Motor", detail: "Cycle mechanical clamp in service diagnostics for the affected channel.", verify: "Head clamps and holds vacuum without mechanical binding or gear slip." }
        ]
      }
    ],
    "111": [
      {
        problem: "Elevated Hydrocarbon / CO / Moisture Output",
        causes: "Exhausted Purafil canisters, saturated activated charcoal, or failed moisture auto-drain valve.",
        steps: [
          { title: "Service Automatic Moisture Drain", detail: "Unscrew condensate bowl beneath receiver tank, clean float valve, and blow clear.", verify: "Condensate valve automatically opens and closes during pressurization." },
          { title: "Replace Chemical Media Canisters", detail: "Unthread canisters; replace purple Purafil (replace when brown) and activated charcoal.", verify: "Background hydrocarbon reading returns to <0.05 ppm." }
        ]
      },
      {
        problem: "Low Delivery Pressure / Continuous Running",
        causes: "Cracked compressor reed valves, clogged inlet air felt filter, or leaking relief valve.",
        steps: [
          { title: "Replace Intake Felt Filter", detail: "Remove intake breather cap, inspect felt element for dust, and replace.", verify: "Air intake suction noticeably increases." },
          { title: "Disassemble Compressor Valve Head", detail: "Unbolt compressor cylinder head, inspect stainless reed valve flappers for cracks.", verify: "Replace damaged valve reeds and verify pressure builds to 60+ psig." }
        ]
      }
    ],
    "1150": [
      {
        problem: "Catalyst Temperature Fails to Rise",
        causes: "Blown main fuse, failed solid-state relay (SSR), or open-circuit thermocouple sensor.",
        steps: [
          { title: "Inspect Rear AC Power Entry Module", detail: "Disconnect main power cable, extract fuse drawer, and check continuity of both fuses with DMM.", verify: "Both fuses show <1 ohm continuity." },
          { title: "Measure Solid State Relay Control Voltage", detail: "Check DC control input terminals across SSR while controller calls for heat.", verify: "Multimeter registers 3–32 VDC control signal." },
          { title: "Measure Heater Element Resistance", detail: "Measure across furnace heater leads.", verify: "Element shows continuous resistance (approx. 20–50 ohms)." }
        ]
      },
      {
        problem: "High CO Reading in Purified Air Output",
        causes: "Low reactor temperature (<350°C), contaminated air supply with oil carryover poisoning catalyst bed.",
        steps: [
          { title: "Verify Operating Temperature", detail: "Check front digital temperature indicator.", verify: "Indicator reaches and maintains nominal 350°C." },
          { title: "Perform 50 psig Pressure Leak Test", detail: "Pressurize catalyst housing to 50 psig and soap test all tube fittings.", verify: "Zero bubble generation at any fitting or weld joint." }
        ]
      }
    ]
  };

  const ADMIN_PIN = "1986";
  let isAdmin = false;
  let activeDb = defaultDatabase;

  const modelSelector = document.getElementById('modelSelector');
  const editModelSelect = document.getElementById('editModel');
  const problemsContainer = document.getElementById('problemsContainer');
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminBadge = document.getElementById('adminBadge');
  const addIssueBtn = document.getElementById('addIssueBtn');
  const syncIndicator = document.getElementById('syncIndicator');

  // REAL-TIME LISTENER & INITIAL SEEDING
  if (isFirebaseAvailable) {
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        activeDb = data;
        syncIndicator.innerHTML = '🟢 Cloud Connected';
      } else {
        // Unang initialization: isulat ang buong database sa cloud
        dbRef.set(defaultDatabase);
        syncIndicator.innerHTML = '🟢 Database Initialized';
      }
      renderProblems();
    }, (error) => {
      syncIndicator.innerHTML = '⚠️ Firebase Error: ' + error.message;
      syncIndicator.style.color = '#ef4444';
      renderProblems();
    });
  } else {
    renderProblems();
  }

  function renderProblems() {
    const selectedModel = modelSelector.value;
    problemsContainer.innerHTML = '';

    if (!selectedModel || !activeDb[selectedModel]) {
      problemsContainer.innerHTML = `<div class="placeholder-msg">Select an analyzer model above to begin.</div>`;
      return;
    }

    const items = activeDb[selectedModel];
    if (items.length === 0) {
      problemsContainer.innerHTML = `<div class="placeholder-msg">No entries recorded for this model yet. Use Admin Mode to create entries.</div>`;
      return;
    }

    items.forEach((item, index) => {
      const problemDiv = document.createElement('div');
      problemDiv.className = 'problem-item';

      let stepsHtml = '';
      if (item.steps && Array.isArray(item.steps)) {
        stepsHtml = item.steps.map((st, i) => `
          <div class="step-card">
            <div class="step-head">
              <span class="step-badge">${i + 1}</span>
              <span>${st.title}</span>
            </div>
            <div class="step-detail">${st.detail}</div>
            <div class="step-verify"><strong>Verification: </strong>${st.verify}</div>
          </div>
        `).join('');
      }

      let adminActionsHtml = '';
      if (isAdmin) {
        adminActionsHtml = `
          <div class="admin-item-actions">
            <button class="btn btn-secondary" onclick="editIssue('${selectedModel}', ${index})">✏️ Edit</button>
            <button class="btn btn-danger" onclick="deleteIssue('${selectedModel}', ${index})">🗑️ Delete</button>
          </div>
        `;
      }

      problemDiv.innerHTML = `
        <button class="problem-header" onclick="toggleProblem(this)">
          <span class="problem-title">⚠️ ${item.problem}</span>
          <span class="icon-toggle">▼</span>
        </button>
        <div class="solution-body">
          <div class="section-title">Probable Causes:</div>
          <div class="causes-box">${item.causes}</div>
          
          <div class="section-title">Step-by-Step Corrective Actions:</div>
          <div class="steps-container">
            ${stepsHtml}
          </div>
          ${adminActionsHtml}
        </div>
      `;

      problemsContainer.appendChild(problemDiv);
    });
  }

  modelSelector.addEventListener('change', renderProblems);

  function toggleProblem(buttonElement) {
    const parentItem = buttonElement.closest('.problem-item');
    parentItem.classList.toggle('active');
  }

  function handleAdminToggle() {
    if (!isAdmin) {
      const pin = prompt("Enter Admin PIN:");
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        adminBadge.classList.remove('hidden');
        addIssueBtn.classList.remove('hidden');
        adminLoginBtn.textContent = "Logout";
        adminLoginBtn.className = "btn btn-danger";
        renderProblems();
      } else if (pin !== null) {
        alert("Invalid PIN. Access denied.");
      }
    } else {
      isAdmin = false;
      adminBadge.classList.add('hidden');
      addIssueBtn.classList.add('hidden');
      adminLoginBtn.textContent = "Admin Login";
      adminLoginBtn.className = "btn btn-primary";
      renderProblems();
    }
  }

  const adminModal = document.getElementById('adminModal');
  const editIndexInput = document.getElementById('editIndex');
  const editProblemInput = document.getElementById('editProblem');
  const editCausesInput = document.getElementById('editCauses');
  const editStepsText = document.getElementById('editStepsText');
  const modalTitle = document.getElementById('modalTitle');

  function openAddIssueModal() {
    modalTitle.textContent = "Add Troubleshooting Entry";
    editIndexInput.value = "-1";
    editModelSelect.value = modelSelector.value || "48i";
    editProblemInput.value = "";
    editCausesInput.value = "";
    editStepsText.value = "";
    adminModal.classList.remove('hidden');
  }

  function editIssue(model, index) {
    const item = activeDb[model][index];
    modalTitle.textContent = "Edit Troubleshooting Entry";
    editIndexInput.value = index;
    editModelSelect.value = model;
    editProblemInput.value = item.problem;
    editCausesInput.value = item.causes;
    
    if (item.steps) {
      editStepsText.value = item.steps.map(s => `${s.title} | ${s.detail} | ${s.verify}`).join('\n');
    } else {
      editStepsText.value = "";
    }
    adminModal.classList.remove('hidden');
  }

  function closeAdminModal() {
    adminModal.classList.add('hidden');
  }

  function saveIssue() {
    const model = editModelSelect.value;
    const index = parseInt(editIndexInput.value, 10);
    const problem = editProblemInput.value.trim();
    const causes = editCausesInput.value.trim();
    const rawSteps = editStepsText.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

    if (!problem || !causes || rawSteps.length === 0) {
      alert("All fields are required. Follow the format: Title | Detail | Verification.");
      return;
    }

    const parsedSteps = rawSteps.map(line => {
      const parts = line.split('|').map(p => p.trim());
      return {
        title: parts[0] || "Step Action",
        detail: parts[1] || parts[0] || "Execute corrective procedure.",
        verify: parts[2] || "Confirm normal reading in diagnostics."
      };
    });

    if (!activeDb[model]) activeDb[model] = [];

    if (index === -1) {
      activeDb[model].push({ problem, causes, steps: parsedSteps });
    } else {
      activeDb[model][index] = { problem, causes, steps: parsedSteps };
    }

    if (isFirebaseAvailable) {
      dbRef.set(activeDb).then(() => {
        closeAdminModal();
        modelSelector.value = model;
      }).catch(err => alert("Error saving to cloud: " + err.message));
    } else {
      closeAdminModal();
      modelSelector.value = model;
      renderProblems();
    }
  }

  function deleteIssue(model, index) {
    if (confirm("Are you sure you want to permanently delete this troubleshooting entry from the cloud database?")) {
      activeDb[model].splice(index, 1);
      if (isFirebaseAvailable) {
        dbRef.set(activeDb);
      } else {
        renderProblems();
      }
    }
  }
</script>

</body>
</html>
